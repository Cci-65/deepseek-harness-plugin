<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultra 档 · 星空轨道特效原型</title>
<style>
  /* ============================================================
     设计变量：颜色 / 尺寸 / 动效集中在这里
     ============================================================ */
  :root {
    --page-bg: #f5f6f8;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    --card-bg: #ffffff;
    --card-radius: 20px;
    --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);

    /* ---- 滑块几何（与插件一致：轨道 23px、旋钮 30px） ---- */
    --track-h: 23px;
    --thumb: 30px;
    --track-bg: #e2e4e8;
    --fill-color: #2f6fed;
    --dot-color: #c6c9cf;

    /* ---- 档位名颜色 ---- */
    --level-color: #2f6fed;
    --level-off-color: #9ca3af;
    --level-max-color: #924ff7;
    --model-color: #6b7280;
    --caption-color: #9ca3af;

    /* ---- Max/Ultra 星空特效 ---- */
    --max-fx-fade: 250ms;
    --max-grad-stop-1: #2f6fed;   /* 0%   宝蓝 */
    --max-grad-stop-2: #5a4bf0;   /* 34%  蓝紫 */
    --max-grad-stop-3: #7c3ff0;   /* 62%  亮紫 */
    --max-grad-stop-4: #8b5cf6;   /* 100% 亮堇紫（右端是亮的） */
    --sweep-opacity: 0.22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: var(--page-bg); font-family: var(--font);
  }
  .pagehead { font-size: 13px; color: var(--caption-color); }

  .card {
    position: relative;
    width: 430px; max-width: calc(100vw - 32px);
    background: var(--card-bg); border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: 26px 26px 20px;
    user-select: none; -webkit-user-select: none;
  }
  .reset {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: transparent; color: #9ca3af; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset:hover { background: #f3f4f6; }

  .title {
    text-align: center; font-size: 26px; font-weight: 700;
    color: var(--level-color);
    transition: opacity 150ms, color 150ms;
  }
  .title.fading { opacity: 0; }
  .title.off { color: var(--level-off-color); }
  .title.max { color: var(--level-max-color); }
  .subtitle {
    margin-top: 6px; text-align: center; font-size: 19px;
    color: var(--model-color); transition: opacity 150ms;
  }

  /* ---- 滑块：所有几何都是 SVG 原语（rect rx / circle + clipPath） ---- */
  .slider {
    margin-top: 24px; position: relative;
    height: var(--thumb); cursor: pointer;
    touch-action: none; outline: none;
  }
  .slider.dragging { cursor: grabbing; }
  .slider svg { display: block; overflow: visible; width: 100%; height: var(--thumb); }
  .slider:focus-visible .ring { stroke: var(--level-color); stroke-width: 2; }

  /* 特效层：进出 Ultra 档 250ms 淡入淡出 */
  #fxg, .halo { opacity: 0; transition: opacity var(--max-fx-fade); pointer-events: none; }
  .slider.level-max #fxg, .slider.level-max .halo { opacity: 1; }
  .slider.level-max .ring { filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9)); }

  /* 星云漂移 */
  .neb1 { animation: neb1 9s ease-in-out infinite alternate; }
  .neb2 { animation: neb2 12s ease-in-out infinite alternate; }
  @keyframes neb1 { from { transform: translateX(-18px); } to { transform: translateX(22px); } }
  @keyframes neb2 { from { transform: translateX(16px); } to { transform: translateX(-20px); } }

  /* 星群整体漂移 + 每颗星独立闪烁（周期/延迟由 JS 逐颗写入） */
  .starDrift { animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
  .star {
    animation-name: twinkle; animation-timing-function: ease-in-out;
    animation-iteration-count: infinite; animation-direction: alternate;
  }
  @keyframes twinkle {
    from { opacity: var(--star-min-op, 0.3); }
    to   { opacity: var(--star-max-op, 0.85); }
  }

  /* 扫光带（渐变呼吸的一种实现） */
  .sweep { animation: sweep 7s linear infinite; }
  @keyframes sweep {
    0%, 55% { transform: translateX(-160%) skewX(-12deg); opacity: 0; }
    56%     { opacity: 1; }
    100%    { transform: translateX(360%) skewX(-12deg); opacity: 1; }
  }

  #burstLayer { pointer-events: none; }

  .below { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .replay {
    border: 1px solid #e2e4e8; background: #fff; color: #6b7280;
    font: inherit; font-size: 13px; border-radius: 999px;
    padding: 7px 16px; cursor: pointer;
  }
  .replay:hover { background: #f3f4f6; }
  .caption {
    font-size: 12.5px; color: var(--caption-color);
    text-align: center; line-height: 1.6; max-width: 430px; padding: 0 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="pagehead">模型思考强度选择器 · Ultra 档星空轨道特效原型（参照 1004 视频逐帧复刻）</div>

  <div class="card">
    <button class="reset" id="reset" title="回到 Off" aria-label="回到 Off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
    </button>
    <div class="title" id="title">Ultra</div>
    <div class="subtitle" id="subtitle">5.6 Terra ›</div>

    <div class="slider" id="slider" role="slider" tabindex="0"
         aria-label="思考强度（特效演示）" aria-valuemin="0" aria-valuemax="5"
         aria-valuenow="5" aria-valuetext="Ultra">
      <svg id="svg" aria-hidden="true" focusable="false"></svg>
    </div>
  </div>

  <div class="below">
    <button class="replay" id="replay">重放「到达迸发」粒子</button>
    <div class="caption">
      拖动旋钮或点击轨道选档，方向键 / Home / End 也可调档。拖到最后一档 <b>Ultra</b> 时：
      轨道渐变为蓝→紫→亮堇紫，两团星云漂移、28 颗星独立闪烁、扫光带循环；
      <b>进入 Ultra 档的一瞬间</b>从旋钮边缘迸出一圈淡紫粒子（飞出轨道外后淡出），旋钮外圈出现白色柔光。
      页面打开即为 Ultra 档，拖回 Off 可看纯蓝基线。
    </div>
  </div>

<script>
'use strict';
/* ===================== 常量与状态 ===================== */
const NS = 'http://www.w3.org/2000/svg';
const TRACK_H = 23, THUMB = 30;           // 与插件一致的滑块几何
const LEVELS = [
  { id: 'off',    name: 'Off',    cls: 'off', sub: '不消耗推理额度' },
  { id: 'low',    name: 'Low',    sub: '标准消耗额度' },
  { id: 'medium', name: 'Medium', sub: '标准消耗额度' },
  { id: 'high',   name: 'High',   sub: '标准消耗额度' },
  { id: 'xhigh',  name: 'X-High', sub: '标准消耗额度' },
  { id: 'max',    name: 'Ultra',  cls: 'max', sub: '5.6 Terra ›' },
];
const N = LEVELS.length;
const IS_MAX = N - 1;

const slider = document.getElementById('slider');
const svg = document.getElementById('svg');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('subtitle');

let index = IS_MAX;      // 打开即停在 Ultra，直接展示特效
let dragFrac = null;     // 拖动中的预览比例
let drag = null;         // 拖动会话
let lastShown = null;    // 上一次展示档位（用于"进入 Ultra"判定）
let lastBurst = 0;       // 迸发冷却
let W = 1;               // 轨道宽（CSS px，来自测量）
let knobX = THUMB / 2;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (v) => clamp(v, 0, 1);
const el = (tag, attrs) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

/* ===================== 一次性素材：星点表 ===================== */
const GLOW = new Set([5, 14, 23]);
const STARS = [];
for (let i = 0; i < 28; i++) {
  const isGlow = GLOW.has(i);
  const op = +(0.65 + Math.random() * 0.35).toFixed(2);
  STARS.push({
    xPct: 0.02 + Math.random() * 0.96,
    yPct: 0.15 + Math.random() * 0.70,
    r: isGlow ? 1.0 + Math.random() * 0.25 : 0.5 + Math.random() * 0.6,
    isGlow,
    dur: (2.2 + Math.random() * 3.3).toFixed(2),
    delay: (-(Math.random() * 5)).toFixed(2),
    minOp: +(op * 0.35).toFixed(2),
    maxOp: op,
  });
}

/* ===================== SVG 结构（自下而上） ===================== */
const defs = el('defs', {});

// 填充裁剪：x=0 到旋钮中心 +2px；高度给到 -8..38，让星云光斑能溢出轨道上下沿
const clipRect = el('rect', { x: 0, y: -8, width: 0, height: 46 });
defs.appendChild(el('clipPath', { id: 'mspFilled' })).appendChild(clipRect);

// Ultra 渐变（右端亮堇紫）
const grad = defs.appendChild(el('linearGradient', { id: 'mspGrad', x1: '0%', y1: '0%', x2: '100%', y2: '0%' }));
[['0%', '--max-grad-stop-1'], ['34%', '--max-grad-stop-2'], ['62%', '--max-grad-stop-3'], ['100%', '--max-grad-stop-4']]
  .forEach(([off, v]) => grad.appendChild(el('stop', { offset: off, 'stop-color': `var(${v})` })));

// 扫光带渐变
const sweepGrad = defs.appendChild(el('linearGradient', { id: 'mspSweep', x1: '0%', y1: '0%', x2: '100%', y2: '0%' }));
sweepGrad.appendChild(el('stop', { offset: '0%', 'stop-color': 'transparent' }));
sweepGrad.appendChild(el('stop', { offset: '50%', 'stop-color': 'rgba(255,255,255,var(--sweep-opacity))' }));
sweepGrad.appendChild(el('stop', { offset: '100%', 'stop-color': 'transparent' }));

// 星云径向渐变
const nebDefs = [
  ['mspNeb1', 'rgba(255,255,255,0.75)', 'rgba(200,180,255,0.45)'],
  ['mspNeb2', 'rgba(255,255,255,0.65)', 'rgba(175,140,255,0.4)'],
];
for (const [id, core, mid] of nebDefs) {
  const g = defs.appendChild(el('radialGradient', { id }));
  g.appendChild(el('stop', { offset: '0%', 'stop-color': core }));
  g.appendChild(el('stop', { offset: '45%', 'stop-color': mid }));
  g.appendChild(el('stop', { offset: '75%', 'stop-color': 'transparent' }));
}
// 虚化滤镜
const fBlur = defs.appendChild(el('filter', { id: 'mspBlur', x: '-80%', y: '-80%', width: '260%', height: '260%' }));
fBlur.appendChild(el('feGaussianBlur', { stdDeviation: '3' }));
const fHalo = defs.appendChild(el('filter', { id: 'mspHaloBlur', x: '-80%', y: '-80%', width: '260%', height: '260%' }));
fHalo.appendChild(el('feGaussianBlur', { stdDeviation: '2.5' }));

svg.appendChild(defs);

// 1. 轨道底
const trackR = el('rect', { class: 'msp-track', x: 0, y: 0, width: 0, height: TRACK_H, rx: TRACK_H / 2, ry: TRACK_H / 2, fill: 'var(--track-bg)' });
svg.appendChild(trackR);

// 2. 纯蓝填充（非 Ultra 档的基线）
const fillR = el('rect', { x: 0, y: 0, width: 0, height: TRACK_H, rx: TRACK_H / 2, ry: TRACK_H / 2, fill: 'var(--fill-color)' });
svg.appendChild(fillR);

// 3. 星空特效组（裁剪在填充内，进 Ultra 档 250ms 淡入）
const fxg = el('g', { id: 'fxg', 'clip-path': 'url(#mspFilled)' });
const gradR = el('rect', { x: 0, y: 0, width: 0, height: TRACK_H, rx: TRACK_H / 2, ry: TRACK_H / 2, fill: 'url(#mspGrad)' });
fxg.appendChild(gradR);
const neb1 = el('circle', { class: 'neb1', r: 16, fill: 'url(#mspNeb1)', filter: 'url(#mspBlur)' });
const neb2 = el('circle', { class: 'neb2', r: 11, fill: 'url(#mspNeb2)', filter: 'url(#mspBlur)' });
fxg.appendChild(neb1); fxg.appendChild(neb2);
const starG = el('g', { class: 'starDrift' });
for (const s of STARS) {
  const c = el('circle', { class: 'star', r: s.r, fill: '#ffffff' });
  c.style.setProperty('--star-min-op', s.minOp);
  c.style.setProperty('--star-max-op', s.maxOp);
  c.style.animationDuration = s.dur + 's';
  c.style.animationDelay = s.delay + 's';
  if (s.isGlow) c.style.filter = 'drop-shadow(0 0 2px rgba(255,255,255,0.7))';
  starG.appendChild(c);
}
fxg.appendChild(starG);
const sweepR = el('rect', { class: 'sweep', x: 0, y: 0, width: 0, height: TRACK_H, fill: 'url(#mspSweep)' });
fxg.appendChild(sweepR);
svg.appendChild(fxg);

// 4. 刻度点（灰）+ 填充内的覆盖点（半透明白）
const dotsG = el('g', {});
const coveredG = el('g', { 'clip-path': 'url(#mspFilled)' });
for (let i = 0; i < N; i++) {
  dotsG.appendChild(el('circle', { r: 3, fill: 'var(--dot-color)' }));
  coveredG.appendChild(el('circle', { r: 3, fill: 'rgba(255,255,255,0.4)' }));
}
svg.appendChild(dotsG); svg.appendChild(coveredG);

// 5. 旋钮光晕 + 旋钮
const halo = el('circle', { class: 'halo', r: THUMB / 2 + 4.5, fill: '#ffffff', filter: 'url(#mspHaloBlur)' });
const thumb = el('circle', { class: 'msp-thumb', r: THUMB / 2, fill: '#ffffff' });
const ring = el('circle', { class: 'ring', r: THUMB / 2 - 0.5, fill: 'none', stroke: '#d8dbe0', 'stroke-width': 1 });
svg.appendChild(halo); svg.appendChild(thumb); svg.appendChild(ring);

// 6. 迸发粒子层（不裁剪，飞出轨道外）
const burstLayer = el('g', { id: 'burstLayer' });
svg.appendChild(burstLayer);

/* ===================== 布局与渲染 ===================== */
const fracOfIndex = (i) => (N > 1 ? i / (N - 1) : 0);
const curFrac = () => (dragFrac !== null ? dragFrac : fracOfIndex(index));
const shownIndex = () => (dragFrac !== null ? clamp(Math.round(dragFrac * (N - 1)), 0, N - 1) : index);

function layout() {
  W = Math.max(1, Math.round(slider.clientWidth));
  svg.setAttribute('viewBox', `0 0 ${W} ${THUMB}`);
  const cy = THUMB / 2;
  const trackY = cy - TRACK_H / 2;
  const inner = Math.max(0, W - THUMB);
  const frac = curFrac();
  knobX = cy + inner * frac;
  const fillW = knobX + 2;
  const showFill = frac > 0.003;

  trackR.setAttribute('y', trackY);
  trackR.setAttribute('width', W);
  fillR.setAttribute('y', trackY);
  fillR.setAttribute('width', fillW);
  fillR.style.display = showFill ? '' : 'none';
  coveredG.style.display = showFill ? '' : 'none';
  clipRect.setAttribute('width', Math.max(0, fillW));

  gradR.setAttribute('y', trackY);
  gradR.setAttribute('width', W);
  sweepR.setAttribute('y', trackY);
  sweepR.setAttribute('width', W * 0.35);

  // 星云 1 跟在旋钮左侧，星云 2 在轨道中部偏右
  neb1.setAttribute('cx', knobX - 26); neb1.setAttribute('cy', cy);
  neb2.setAttribute('cx', W * 0.55);   neb2.setAttribute('cy', cy);

  // 刻度点：与插件相同的两端内缩公式
  const dotX0 = cy + (TRACK_H / 2 - THUMB / 2);
  const dotSpan = Math.max(0, inner - (TRACK_H / 2 - THUMB / 2) * 2);
  const dotRows = [dotsG.childNodes, coveredG.childNodes];
  for (let i = 0; i < N; i++) {
    const cx = dotX0 + dotSpan * fracOfIndex(i);
    for (const list of dotRows) { list[i].setAttribute('cx', cx); list[i].setAttribute('cy', cy); }
  }
  STARS.forEach((s, i) => {
    const c = starG.childNodes[i];
    c.setAttribute('cx', s.xPct * W);
    c.setAttribute('cy', trackY + s.yPct * TRACK_H);
  });

  halo.setAttribute('cx', knobX); halo.setAttribute('cy', cy);
  thumb.setAttribute('cx', knobX); thumb.setAttribute('cy', cy);
  ring.setAttribute('cx', knobX); ring.setAttribute('cy', cy);
}

let textToken = 0;
function setTexts(shown, immediate) {
  const lv = LEVELS[shown];
  const want = lv.name + '|' + (lv.cls || '');
  if (titleEl.dataset.want === want) return;
  if (immediate) {
    titleEl.textContent = lv.name;
    titleEl.className = 'title' + (lv.cls ? ' ' + lv.cls : '');
    titleEl.dataset.want = want;
    subEl.textContent = lv.sub;
    return;
  }
  const tok = ++textToken;
  titleEl.classList.add('fading');
  subEl.style.opacity = '0';
  setTimeout(() => {
    if (tok !== textToken) return;
    titleEl.textContent = lv.name;
    titleEl.className = 'title' + (lv.cls ? ' ' + lv.cls : '');
    titleEl.dataset.want = want;
    subEl.textContent = lv.sub;
    titleEl.classList.remove('fading');
    subEl.style.opacity = '';
  }, 150);
}

function render(immediateText) {
  const s = shownIndex();
  slider.classList.toggle('level-max', s === IS_MAX);
  slider.classList.toggle('dragging', dragFrac !== null && drag && drag.moved);
  layout();
  setTexts(s, immediateText);
  slider.setAttribute('aria-valuenow', s);
  slider.setAttribute('aria-valuetext', LEVELS[s].name);
  // 进入 Ultra 档的一瞬（拖动预览或落档都算）触发一次粒子迸发
  if (s === IS_MAX && lastShown !== null && lastShown !== IS_MAX) tryBurst();
  lastShown = s;
}

/* ===================== 到达迸发（一次性粒子） ===================== */
function burst() {
  const cy = THUMB / 2;
  const colors = ['#a78bfa', '#c4b5fd', '#8b5cf6'];
  for (let i = 0; i < 13; i++) {
    const upper = Math.random() < 0.6;  // 六成往上散，四成偏右
    const ang = upper ? (-Math.PI / 2 + (Math.random() - 0.5) * 1.9)
                      : (-1.2 + Math.random() * 1.7);
    const dist = 30 + Math.random() * 50;
    const r = 1.5 + Math.random() * 2.5;
    const c = el('circle', { cx: knobX, cy, r, fill: colors[i % 3], opacity: 0.95 });
    burstLayer.appendChild(c);
    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist;
    const dur = 800 + Math.random() * 400;
    const anim = c.animate(
      [
        { transform: 'translate(0px, 0px) scale(1)', opacity: 0.95 },
        { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(0.45)`, opacity: 0 },
      ],
      { duration: dur, easing: 'cubic-bezier(0.16, 0.8, 0.3, 1)', fill: 'forwards' },
    );
    anim.onfinish = () => c.remove();
  }
}
function tryBurst() {
  const now = performance.now();
  if (now - lastBurst < 700) return;   // 冷却，防止拖动时反复触发
  lastBurst = now;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  burst();
}

/* ===================== 交互（与插件一致的手感） ===================== */
const DRAG_THRESHOLD = 10;
const fracFromEvent = (e, offset = 0) => {
  const rect = slider.getBoundingClientRect();
  const r = THUMB / 2;
  const denom = rect.width - 2 * r;
  return denom > 0 ? clamp01((e.clientX - offset - rect.left - r) / denom) : 0;
};
const commitIndex = (i) => { index = clamp(i, 0, N - 1); dragFrac = null; render(); };

slider.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { slider.focus({ preventScroll: true }); } catch (_) {}
  const rect = slider.getBoundingClientRect();
  const cy = THUMB / 2;
  const inner = Math.max(0, W - THUMB);
  const thumbCX = rect.left + cy + inner * fracOfIndex(index);
  const onThumb = Math.abs(e.clientX - thumbCX) <= THUMB / 2;
  let grab = onThumb ? e.clientX - thumbCX : 0;
  if (!onThumb) {
    // 点击轨道空白：直接吸附到目标档位，并记录相对新拇指中心的偏移
    const idx = clamp(Math.round(fracFromEvent(e, 0) * (N - 1)), 0, N - 1);
    grab = e.clientX - (rect.left + cy + inner * fracOfIndex(idx));
    commitIndex(idx);
  }
  drag = { id: e.pointerId, startX: e.clientX, startY: e.clientY, moved: false, grab };
  try { slider.setPointerCapture(e.pointerId); } catch (_) {}
});
slider.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < DRAG_THRESHOLD) return;
    drag.moved = true;
  }
  dragFrac = fracFromEvent(e, drag.grab);
  render();
});
const endDrag = (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  try { slider.releasePointerCapture(e.pointerId); } catch (_) {}
  if (drag.moved) commitIndex(Math.round(fracFromEvent(e, drag.grab) * (N - 1)));
  else { dragFrac = null; render(); }
  drag = null;
};
slider.addEventListener('pointerup', endDrag);
slider.addEventListener('pointercancel', endDrag);
slider.addEventListener('keydown', (e) => {
  let next = null;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); next = index - 1; }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); next = index + 1; }
  else if (e.key === 'Home') { e.preventDefault(); next = 0; }
  else if (e.key === 'End') { e.preventDefault(); next = N - 1; }
  if (next !== null) commitIndex(next);
});

document.getElementById('reset').addEventListener('click', () => commitIndex(0));
document.getElementById('replay').addEventListener('click', () => {
  lastBurst = performance.now();
  if (index !== IS_MAX) { commitIndex(IS_MAX); return; }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) burst();
});

/* ===================== 启动与自适应 ===================== */
render(true);
if (typeof ResizeObserver === 'function') {
  new ResizeObserver(() => layout()).observe(slider);
} else {
  window.addEventListener('resize', layout);
}
</script>
</body>
